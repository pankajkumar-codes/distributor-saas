# Invoice and note numbering (LLD-0 §6.5). The figures are CGST Rule 46(b), read in the official
# rules text 2026-11-26 (#458) and confirmed by the GST CA expert (CA-7); uniqueness per FY per GSTIN (case-insensitive) is the
# numbering code's rule, not a refdata row.

- key: invoice.number.max_length
  value: "16"
  type: integer
  kind: tax
  valid_from: 2017-07-01
  source_url: https://taxinformation.cbic.gov.in/content/html/tax_repository/gst/rules/cgst_rules/active/chapter6/rule46_v1.00.html
  source_title: "CGST Rule 46(b): 'a consecutive serial number not exceeding sixteen characters, in one or multiple series ... unique for a financial year'; the same in rules 49(b) and 53(1A)(c). Read in the official CGST Rules 2017 compilation (GST Docs, amended to about March 2025)"
  last_checked: 2026-11-26
  status: expert_confirmed
  confirmed_by: "GST CA expert thread, CA-7 answer (team/program-lead/ca-invoice-number-copies-answer-v1.md; issue #457)"
  confirmed_on: 2026-11-26
  note: "Official Rule 46(b) text read 2026-11-26 (#458); the GST CA expert confirmed it (CA-7): the 16 include any prefix, 'alphabets' has no case limit, and no other symbol is allowed. Nothing after about March 2025 was checked. valid_from is the GST start date (the limit came by amendment; its own start date is not on file and no earlier invoice is issued here). Not cbic-gst.gov.in/gst-invoice-rules.html: that page shows the 2017 draft rules, without the 16-character limit."

- key: invoice.number.charset
  value: "^[A-Za-z0-9/-]+$"
  type: pattern
  kind: tax
  valid_from: 2017-07-01
  source_url: https://taxinformation.cbic.gov.in/content/html/tax_repository/gst/rules/cgst_rules/active/chapter6/rule46_v1.00.html
  source_title: "CGST Rule 46(b): 'containing alphabets or numerals or special characters- hyphen or dash and slash symbolised as - and / respectively, and any combination thereof'. Read in the official CGST Rules 2017 compilation (GST Docs, amended to about March 2025)"
  last_checked: 2026-11-26
  status: expert_confirmed
  confirmed_by: "GST CA expert thread, CA-7 answer (team/program-lead/ca-invoice-number-copies-answer-v1.md; issue #457)"
  confirmed_on: 2026-11-26
  note: "Official Rule 46(b) text read 2026-11-26 (#458); the GST CA expert confirmed it (CA-7): the 16 include any prefix, 'alphabets' has no case limit, and no other symbol is allowed. Nothing after about March 2025 was checked. Length is invoice.number.max_length. team/gst/document-fields.md row 3 writes A-Z; the rule says alphabets, so lower case is allowed here and uniqueness is case-insensitive."

# Invoice computation (LLD-4 §3, L4-1). Copied from the GST expert's
# team/gst/refdata-lld4.md v1.0 §1. Tax rows, provisional until the CA confirms (D-022).
- key: invoice.rounding_mode
  value: "ROUND_HALF_UP"
  type: text
  kind: tax
  valid_from: 2017-07-01
  valid_to: null
  source_url: https://taxinformation.cbic.gov.in/content/html/tax_repository/gst/rules/cgst_rules/active/chapter6/rule46_v1.00.html
  source_title: "No rule prescribes invoice-line rounding (Rules 46-55 read; s.170 rounds tax payable, not invoice lines). Method from r3-invoice-examples.md R1-R5 (D-022)"
  last_checked: 2026-10-24
  status: provisional
  note: "Per line, per component, half-up to paise. CA to confirm (D-022). sales accepts ROUND_HALF_UP or ROUND_HALF_EVEN."
- key: invoice.round_off_line
  value: "false"
  type: boolean
  kind: tax
  valid_from: 2017-07-01
  valid_to: null
  source_url: https://taxinformation.cbic.gov.in/content/html/tax_repository/gst/rules/cgst_rules/active/chapter6/rule46_v1.00.html
  source_title: "Not required by Rule 46; s.170 rounding applies to amounts payable under the Act, not invoice totals"
  last_checked: 2026-10-24
  status: provisional
  note: "Default off (D-022). CA to confirm whether a whole-rupee round-off line is wanted."
- key: invoice.round_off_line
  value: "true"
  type: boolean
  kind: tax
  valid_from: 2026-11-26
  valid_to: null
  source_url: https://taxinformation.cbic.gov.in/content/html/tax_repository/gst/rules/cgst_rules/active/chapter6/rule46_v1.00.html
  source_title: "Not required by Rule 46; a whole-rupee round-off line is common practice and changes no line's taxable value or tax"
  last_checked: 2026-11-26
  status: provisional
  note: "On from 2026-11-26 (D-109, Pankaj): an MRP-based invoice then totals the MRP in whole rupees (MRP 100 at 18%: 84.75 + 7.63 + 7.63 = 100.01, round off -0.01, total 100.00). Rounding is invoice.rounding_mode to the rupee. Earlier dates keep the row above (off). CA to confirm (D-022)."
- key: invoice.round_off_line
  value: "false"
  type: boolean
  kind: tax
  valid_from: 2026-11-27
  valid_to: null
  source_url: https://taxinformation.cbic.gov.in/content/html/tax_repository/gst/rules/cgst_rules/active/chapter6/rule46_v1.00.html
  source_title: "Not required by Rule 46; s.170 rounding applies to amounts payable under the Act, not invoice totals"
  last_checked: 2026-11-26
  status: provisional
  note: "Off again from 2026-11-27 (D-110, Pankaj): the bill shows exact paise; rounding to the nearest rupee charged or lost up to 50 paise. A loaded row is never edited or removed, so the 2026-11-26 row (on) still covers that one day."
# invoice.round_off_line above is no longer read (D-111): its rows stay, as loaded refdata
# rows are never edited or removed, but the 2026-11-26 row (on) could not be undone for
# that day. The compute reads invoice.round_to_rupee instead, off on every date.
- key: invoice.round_to_rupee
  value: "false"
  type: boolean
  kind: tax
  valid_from: 2017-07-01
  valid_to: null
  source_url: https://taxinformation.cbic.gov.in/content/html/tax_repository/gst/rules/cgst_rules/active/chapter6/rule46_v1.00.html
  source_title: "Not required by Rule 46; s.170 rounding applies to amounts payable under the Act, not invoice totals"
  last_checked: 2026-11-26
  status: provisional
  note: "Off on every date (D-111, Pankaj 2026-11-26: no round-off at all; the bill shows exact paise). True would add a whole-rupee round-off line using invoice.rounding_mode. CA to confirm (D-022)."

- key: invoice.unregistered_address_threshold
  value: "50000.00"
  type: decimal
  kind: tax
  valid_from: 2017-07-01
  valid_to: null
  source_url: https://taxinformation.cbic.gov.in/content/html/tax_repository/gst/rules/cgst_rules/active/chapter6/rule46_v1.00.html
  source_title: "CGST Rule 46(e): name, address and delivery address 'if such recipient is un-registered and where the value of the taxable supply is fifty thousand rupees or more'"
  last_checked: 2026-10-24
  status: provisional
  note: "Comparison >= (rule says 'or more'). Rule is on value of taxable supply; LLD-4 compares doc_total, which is stricter and safe. CA."
- key: eway.consignment_value_threshold
  value: "50000.00"
  type: decimal
  kind: tax
  valid_from: 2018-04-01
  valid_to: null
  source_url: https://cbic-gst.gov.in/ewaybill-rules.html
  source_title: "CGST Rule 138(1): movement of goods 'of consignment value exceeding fifty thousand rupees'; Explanation 2: value includes CGST/SGST/UTGST/IGST and cess, excludes exempt goods"
  last_checked: 2026-10-24
  status: provisional
  note: "Comparison > (strict). Explanation 2 read only on a secondary copy. States may set other intra-state limits (UNVERIFIED); warn only (HLD 6.3). valid_from is the national e-way bill start for inter-state movement (1 April 2018), not read on an official page today. Kept in invoice.yaml because only the invoice warning reads it."
