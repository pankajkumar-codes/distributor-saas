# Password rules (Pankaj, 16 Nov 2026 local test, item 1; EM relay). They replace LLD-1 L1-9's "no character-class
# rules": the app is stricter than Cognito's pool policy, so Cognito never refuses a password the app accepted.
- key: auth.password_min_length
  value: "10"
  type: integer
  kind: product
  valid_from: 2026-11-16
  source_url: team/engineering/password-policy.md
  source_title: "Password policy, Pankaj's local test item 1 (supersedes LLD-1 L1-9 character-class wording)"
  last_checked: 2026-11-16
  status: provisional
  note: "At least 10 characters. PO to confirm. A change to any auth.password_* row reaches sign-up and reset within 60 s (a per-process cache), so for up to a minute a screen and the server may apply different rules."

- key: auth.password_max_length
  value: "128"
  type: integer
  kind: product
  valid_from: 2026-11-16
  source_url: team/docs/lld-1.md
  source_title: "LLD-1 L1-9 (the 128-character upper limit is unchanged)"
  last_checked: 2026-11-16
  status: provisional
  note: "A longer password is refused with its own message. Must stay at or below what a Cognito user pool takes (256); a test checks it."

- key: auth.password_require_upper
  value: "true"
  type: boolean
  kind: product
  valid_from: 2026-11-16
  source_url: team/engineering/password-policy.md
  source_title: "Password policy, Pankaj's local test item 1"
  last_checked: 2026-11-16
  status: provisional
  note: "At least one uppercase letter, A to Z."

- key: auth.password_require_lower
  value: "true"
  type: boolean
  kind: product
  valid_from: 2026-11-16
  source_url: team/engineering/password-policy.md
  source_title: "Password policy, Pankaj's local test item 1"
  last_checked: 2026-11-16
  status: provisional
  note: "At least one lowercase letter, a to z."

- key: auth.password_require_digit
  value: "true"
  type: boolean
  kind: product
  valid_from: 2026-11-16
  source_url: team/engineering/password-policy.md
  source_title: "Password policy, Pankaj's local test item 1"
  last_checked: 2026-11-16
  status: provisional
  note: "At least one digit, 0 to 9."

- key: auth.password_require_special
  value: "true"
  type: boolean
  kind: product
  valid_from: 2026-11-16
  source_url: team/engineering/password-policy.md
  source_title: "Password policy, Pankaj's local test item 1"
  last_checked: 2026-11-16
  status: provisional
  note: "At least one character from auth.password_specials."

- key: auth.password_specials
  value: "!@#$%^&*()-_=+[]{}.,?"
  type: text
  kind: product
  valid_from: 2026-11-16
  source_url: team/engineering/password-policy.md
  source_title: "Password policy, Pankaj's local test item 1 (the EM proposed this fixed set)"
  last_checked: 2026-11-16
  status: provisional
  note: "The special characters that count. A space is allowed inside a password but is not a special character."

- key: auth.session_confirm_minutes
  value: "10"
  type: integer
  kind: product
  valid_from: 2026-11-19
  source_url: https://claude.ai/artifact/F48P7oLdrB1cNp6WqZbQcA
  source_title: "BRD v1.3, owner decision 2026-11-18 (one active session per user)"
  last_checked: 2026-11-19
  status: provisional
  note: "After a second sign-in is asked 'end the other session?', the answer must come within 10 minutes of that sign-in."

- key: auth.session_live_minutes
  value: "30"
  type: integer
  kind: product
  valid_from: 2026-11-19
  source_url: https://claude.ai/artifact/F48P7oLdrB1cNp6WqZbQcA
  source_title: "BRD v1.3, owner retest item 6 (a stale session must not block the owner's own sign-in)"
  last_checked: 2026-11-19
  status: provisional
  note: "A session counts as the user's active one for the one-session question only if it was used in the last 30 minutes. The 24-hour idle rule still decides whether the session works."
