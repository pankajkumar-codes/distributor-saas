# E-invoicing turnover thresholds (LLD-1 erratum S-3, business.einvoice_status). Copied
# from the GST expert's team/gst/refdata-lld4.md v1.0 §2. Each valid_to there is the last
# day a row covers; the loader reads valid_to as the first day it no longer covers, so
# each row here ends where the next starts (the dates covered are the same). Tax rows,
# provisional until the CA confirms. The rule (refdata-lld4.md §2): e-invoicing applies on
# a date if aggregate turnover in any FY from einvoice.aato_first_fy up to the FY before
# that date's FY is more than einvoice.aato_threshold on that date.

- key: einvoice.aato_threshold
  value: "5000000000.00"
  type: decimal
  kind: tax
  valid_from: 2020-10-01
  valid_to: 2021-01-01
  source_url: https://gstcouncil.gov.in/sites/default/files/2024-05/notfctn-61-central-tax-english-2020.pdf
  source_title: "Notf 61/2020-CT (30-07-2020): ₹500 crore; start 01-10-2020 per einvoice1.gst.gov.in notifications list"
  last_checked: 2026-10-24
  status: provisional
  note: "Effective date from the e-invoice portal list, not the notification text."
