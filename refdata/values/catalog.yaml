# Catalog rules (LLD-3 §3, §4, §11). The product rows are LLD-3's proposals, provisional
# until the PO confirms them; the tax row is the GST expert's rate-change warning
# window.

- key: catalog.rate_change_warning_days
  value: "30"
  type: integer
  kind: tax
  valid_from: 2017-07-01
  source_url: team/gst/tax-computation.md
  source_title: "Tax computation §5 (rate changed between order, invoice and payment dates; CGST s.14): warn when the rate changed in the 30 days before the invoice date"
  last_checked: 2026-10-27
  status: provisional
  note: "Marked [CA] in the GST expert's document: the CA confirms the window."

- key: catalog.rate_valid_from_max_days_ahead
  value: "366"
  type: integer
  kind: product
  valid_from: 2017-07-01
  source_url: team/docs/lld-3.md
  source_title: "LLD-3 §3 and §11: how far ahead a new rate may start (proposal 366 days)"
  last_checked: 2026-10-27
  status: provisional

- key: catalog.product_code.max_length
  value: "40"
  type: integer
  kind: product
  valid_from: 2017-07-01
  source_url: team/docs/lld-3.md
  source_title: "LLD-3 §4 and §11: product code length (proposal 40; the column is varchar(40))"
  last_checked: 2026-10-27
  status: provisional
  note: "The column holds at most 40, so a PO value above 40 needs a migration first."

- key: customer.credit_days_max
  value: "365"
  type: integer
  kind: product
  valid_from: 2017-07-01
  source_url: team/docs/lld-3.md
  source_title: "LLD-3 §4 and §11: the most credit days a customer may have (proposal 365)"
  last_checked: 2026-10-27
  status: provisional

- key: address.pin_pattern
  value: "^[1-9][0-9]{5}$"
  type: pattern
  kind: product
  valid_from: 2017-07-01
  source_url: team/docs/lld-3.md
  source_title: "LLD-3 §4 and §11: the shape of an Indian PIN code (proposal: six digits, not starting with 0)"
  last_checked: 2026-10-27
  status: provisional
  note: "Shape only; it never says whether a PIN exists or matches the state."

- key: catalog.import.max_bytes
  value: "2097152"
  type: integer
  kind: product
  valid_from: 2017-07-01
  source_url: team/docs/lld-3.md
  source_title: "LLD-3 §7.1, §7.2 and §11: the largest product CSV or XLSX accepted, in bytes (proposal 2 MB)"
  last_checked: 2026-11-02
  status: provisional

- key: catalog.import.max_rows
  value: "5000"
  type: integer
  kind: product
  valid_from: 2017-07-01
  source_url: team/docs/lld-3.md
  source_title: "LLD-3 §7.1, §7.2 and §11: the most data rows in one product file (proposal 5,000)"
  last_checked: 2026-11-02
  status: provisional

- key: catalog.import.keep_days
  value: "90"
  type: integer
  kind: product
  valid_from: 2017-07-01
  source_url: team/docs/lld-3.md
  source_title: "LLD-3 §7.1, §7.2 and §11: how long import runs and rows are kept (proposal 90, matching raw uploads, NF-4)"
  last_checked: 2026-11-02
  status: provisional
