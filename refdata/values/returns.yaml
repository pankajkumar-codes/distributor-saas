# Return due dates and the IFF cap (LLD-5 §2.5, §4, §8). GSTR-1 and GSTR-3B dates (monthly,
# QRMP, and the QRMP 3B state groups) are from the SMFG India Credit page Pankaj designated
# on 2026-11-13: a lender's article, third-party and unconfirmed. IFF, PMT-06 and the cap are
# from the GST expert's team/gst/refdata-lld4.md §3. Every row is provisional until the GST
# expert or CA confirms it (D-038); the web shows no date as confirmed until then.
#
# A due date is "day N of the month after the period": after the month for monthly returns,
# the IFF and PMT-06, and after the quarter's last month for quarterly returns
# (refdata-lld4.md §3). A holiday does not move it; extensions are separate rows (GC-24).
# The quarterly GSTR-3B day depends on the GSTIN's state: two state lists, no overlap, and
# a state in neither list has no date (a null date, never a guess). Today the lists hold only the
# states the source page names.

