# Return due dates and the IFF cap (LLD-5 §2.5, §4, §8). The GSTR-1, GSTR-3B and PMT-06 dates and
# the quarterly GSTR-3B state lists were supplied by Pankaj on 2026-11-26 and confirmed by the GST
# CA expert the same day against CGST rule 61 and the GST portal FAQs
# (team/program-lead/ca-due-dates-answer-v1.md, issue #424, D-106). IFF and the cap are from the GST
# expert's team/gst/refdata-lld4.md §3 and stay provisional (D-038).
#
# A due date is "day N of the month after the period": after the month for monthly returns,
# the IFF and PMT-06, and after the quarter's last month for quarterly returns
# (refdata-lld4.md §3). A holiday does not move it; extensions are separate rows (GC-24).
# The quarterly GSTR-3B day depends on the GSTIN's state: two state lists (Category 1, the 22nd;
# Category 2, the 24th), no overlap, and a state in neither list (97, Other Territory) has no date
# (a null date, never a guess). The full lists (issue #424, D-106)
# replace the partial group_a/group_b lists, which stay loaded but are no longer read
# (refdata rows are never removed).
#
# Extensions (issue #424). The government moves a due date by notification. To show an extended
# date, add a row, with no code change:
#   name:  due.extension.FORM.pYYYY_MM               for all states (example: GSTR-3B for October 2026
#          is due.extension.gstr3b.p2026_10), or due.extension.FORM.pYYYY_MM.state_CODE for one state
#   FORM:  gstr1, gstr3b, iff or pmt06; YYYY_MM is the month the period ENDS (a quarter: its
#          last month, e.g. p2026_12 for Oct-Dec 2026)
#   value: the extended due date as "YYYY-MM-DD", type text, kind tax, valid_from 2021-01-01,
#          and the notification as the source. A one-state row wins over an all-states row.
# None is shipped: we do not invent extensions.

