  source_title: "Pankaj 2026-11-26 (decision card on #456): practice credit notes on practice invoices, own series PR-CN-"
  last_checked: 2026-11-26
  status: provisional
  note: "Width is sales.practice_width. A live credit note uses the credit_note series settings (CN/YY-MM/NNNNNN, D-114)."

