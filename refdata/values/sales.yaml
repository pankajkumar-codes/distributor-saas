# Sales product rules (LLD-4). Product rows, provisional until the PO confirms them.

- key: sales.draft_keep_days
  value: "180"
  type: integer
  kind: product
  valid_from: 2026-11-09
  source_url: team/docs/lld-4.md
  source_title: "LLD-4 §2.1: drafts open longer than sales.draft_keep_days (proposal 180) are deleted by retention"
  last_checked: 2026-11-09
  status: provisional
  note: "Counted from the draft's last save. Read only by retention.purge_drafts, which ships disabled."

# Finalize (LLD-4 §4). Built behind a switch while the numbering scope waits for the CA
# (D-010, CA-1); CEO 2026-11-09: finalize is built, off by default, with the scope from
# config on a provisional row.

- key: sales.finalize.enabled
  value: "false"
  type: boolean
  kind: product
  valid_from: 2026-11-09
  source_url: team/docs/lld-4.md
  source_title: "LLD-4 §4 finalize; CEO 2026-11-09: build it behind a switch that is off until the CA confirms the numbering scope"
  last_checked: 2026-11-09
  status: provisional
  note: "While false, POST /drafts/{id}/finalize is a 404 and no number is issued. Turn on with a later row once D-010 is confirmed."

- key: sales.finalize.live
  value: "false"
  type: boolean
  kind: product
  valid_from: 2026-11-09
  source_url: team/docs/release-plan-v2.md
  source_title: "Release plan v2, R3-M5: live finalize and return assignment stay off until the CA confirms the numbering scope (D-010, D-044)"
  last_checked: 2026-11-18
  status: provisional
  note: "Second switch, read after sales.finalize.enabled. While false, a business set to live numbering is refused (live_numbering_unavailable) and no document is assigned to a return. Turn on with a later row only after the CA answers (CA-1)."

- key: sales.numbering_scope
  value: "gstin_kind_fy"
  type: enum
  allowed: [gstin_kind_fy]
  kind: product
  valid_from: 2026-11-09
  source_url: team/docs/lld-4.md
  source_title: "LLD-4 §2.2 and L4-2: one series per GSTIN, document kind and FY, prefix fixed for the FY"
  last_checked: 2026-11-09
  status: provisional
  note: "D-010: the CA confirms the legal scope (CA-1). Another scope is a new allowed value plus code and a migration for its unique index."

- key: sales.numbering_scope
  value: "gstin_kind_month"
  type: enum
  allowed: [gstin_kind_fy, gstin_kind_month]
  kind: product
  valid_from: 2026-11-26
  source_url: https://github.com/pankajkumar-codes/distributor-saas/issues/457
  source_title: "Pankaj's decision 2026-11-26: live numbers INV/YY-MM/NNNNNN, a series per month of the invoice date restarting at 1 (CGST Rule 46(b) allows one or multiple series, unique for a financial year)"
  last_checked: 2026-11-26
  status: provisional
  note: "Read only for live numbers (practice numbers stay one series per FY). Invoices dated before 2026-11-26 keep gstin_kind_fy. Live finalize is still off (sales.finalize.live)."

- key: sales.practice_prefix
  value: "PR-"
