# Sales product rules (LLD-4). Product rows, provisional until the PO confirms them.

- key: sales.draft_keep_days
  value: "180"
  type: integer
  kind: product
  valid_from: 2026-11-09
  source_url: team/docs/lld-4.md
  source_title: "LLD-4 §2.1: drafts open longer than sales.draft_keep_days (proposal 180) are deleted by retention"
  last_checked: 2026-11-09
  status: provisional
  note: "Counted from the draft's last save. Read only by retention.purge_drafts, which ships disabled."

# Finalize (LLD-4 §4). Built behind a switch while the numbering scope waits for the CA
# (D-010, CA-1); CEO 2026-11-09: finalize is built, off by default, with the scope from
# config on a provisional row.

- key: sales.finalize.enabled
  value: "false"
  type: boolean
  kind: product
  valid_from: 2026-11-09
  source_url: team/docs/lld-4.md
  source_title: "LLD-4 §4 finalize; CEO 2026-11-09: build it behind a switch that is off until the CA confirms the numbering scope"
  last_checked: 2026-11-09
  status: provisional
  note: "While false, POST /drafts/{id}/finalize is a 404 and no number is issued. Turn on with a later row once D-010 is confirmed."

