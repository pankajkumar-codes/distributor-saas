  kind: product
  valid_from: 2026-11-09
  source_url: team/docs/lld-4.md
  source_title: "LLD-4 §2.2: practice series use prefix sales.practice_prefix (PR-), width 4"
  last_checked: 2026-11-09
  status: provisional

- key: sales.practice_width
  value: "4"
