# Per-user, per-business hourly limits on API writes and heavy reads (#472, D-120; app/ratelimits.py).
# Product rules sized well above what one person does by hand; provisional until the PO confirms them.

- key: ratelimit.render_per_user_per_business_per_hour
  value: "120"
  type: integer
  kind: product
  valid_from: 2017-07-01
  source_url: team/staff-engineer/rate-limit-plan-2026-11-26.md
  source_title: "Rate limits for every API: review and plan (Staff Engineer, approved by Pankaj 2026-11-26)"
  last_checked: 2026-11-26
  status: provisional
  note: "Calls one user may make in an hour for one business: PDFs made (invoice, draft preview, GSTR-3B worksheet). Past it: 429 with Retry-After."

