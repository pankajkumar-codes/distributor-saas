# GST rules for the catalog (LLD-3 §3, §4). Copied verbatim from the GST expert's
# team/gst/refdata-rates-uqc.md v1.0 §2, which cites each row; tax rows, provisional
# until the CA or the GST expert confirms them (go-live needs require_confirmed).
#
# One change from that document: gst.rate_values is type text, not enum. The loader's
# enum type checks a value against `allowed`, and this value is the list itself
# (comma-separated decimal strings), so catalog.rates parses it into Decimals. And each
# valid_to is the next row's valid_from: the loader reads valid_to as the first day a row
# no longer covers, while the document gives the last day it does (2022-03-31 for a row
# that ends when 2022-04-01 starts). The dates covered are the same. 0 and 0.1 are
# deliberately absent (refdata-rates-uqc.md §1).

