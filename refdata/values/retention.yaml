# Operational retention periods (LLD-0 §4.4, LLD-6 §6; D-041). Design periods from the
# LLDs, not statutory ones: product rows, provisional until the PO confirms them. A
# table with no row here is kept (rate windows: OPEN_QUESTIONS). GST-record retention is
# not here; it waits for the CA (GC-27) and the CEO (LLD-6 §6.5).

- key: retention.purge_operational.enabled
  value: "false"
  type: boolean
  kind: product
  valid_from: 2026-11-02
  source_url: team/docs/lld-6.md
  source_title: "LLD-6 §6.1: a rule runs only while retention.<rule>.enabled is true"
  last_checked: 2026-11-02
  status: provisional
  note: "Ships off (default keep). Switching it on is a later refdata change, after a dry run on staging."

