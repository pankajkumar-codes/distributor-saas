# What the turnover band (business.turnover_bands.band) is measured against. Sign-up and
# the profile ask "up to the limit for quarterly filing (QRMP)" or "above that limit"
# (web BusinessPage), so a band answers rules at other thresholds only when the figures
# are equal; business.hsn_min_digits and business.einvoice_status compare them and fall
# back to the stricter answer when they differ.
- key: business.turnover_band_threshold
  value: "50000000.00"
  type: decimal
  kind: tax
  valid_from: 2021-01-01
  source_url: https://taxinformation.cbic.gov.in/content/html/tax_repository/gst/rules/cgst_rules/active/chapter8/rule61a_v1.00.html
  source_title: "GST Council Circular 143/13/2020-GST dated 10-11-2020 (QRMP scheme: registered person with aggregate turnover up to five crore rupees in the preceding financial year); CGST Rules 2017, rule 61A(1), inserted by Notification 82/2020-CT dated 10-11-2020"
  last_checked: 2026-11-19
  status: expert_confirmed
  confirmed_by: "GST CA expert, v4 answers (source Circular 143/13/2020-GST); issue #362"
  confirmed_on: 2026-11-19
  note: "Up to five crore rupees aggregate turnover in the preceding financial year. valid_from = QRMP start 01-01-2021, as qrmp.option_window.*."

# GSTIN lookup at sign-up (#249, D-100). The feature itself is switched by the deployment setting GSTIN_LOOKUP_PROVIDER
# (unset = off), not by a row. This row only caps how often one signed-in user may ask, so a paid provider cannot be used
# as a free directory.
- key: business.gstin_lookup.per_user_per_hour
  value: "30"
  type: integer
  kind: product
  valid_from: 2026-11-19
  source_url: team/research/gstin-lookup-providers-2026-11-16.md
  source_title: "D-100 GSTIN lookup at sign-up (CEO decision, 2026-11-19, issue #249)"
  last_checked: 2026-11-19
  status: provisional
  note: "Lookups per signed-in user per hour (429 rate_limited past it). Not a GST rule. PO to confirm; revisit when a vendor's per-call price is known."
