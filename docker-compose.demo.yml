# The whole product on your own computer, for trying a milestone by hand (docs/LOCAL_DEMO.md).
# Start it with demo.ps1 (Windows) or ./demo.sh (Mac, Linux); do not run this file by hand.
#
# Local only: made-up data, sign-in codes printed to the terminal instead of emailed, a
# throwaway database. Sign-in accounts live in a file in the `build` volume (DEMO_AUTH_STATE_FILE), so restarting
# only the API keeps them; stopping the demo removes the volume, and that is why every start begins empty.
name: gstdemo

x-api: &api
  build: { context: ., dockerfile: demo/Dockerfile, target: api }
  image: gstdemo-api
  environment: &api-env
    PLATFORM_ENV: local
    DEMO_READERS: "1"
    GSTIN_LOOKUP_PROVIDER: fake  # made-up details for a valid GSTIN at sign-up (docs/GSTIN_LOOKUP.md); never real data
    DATABASE_URL: postgresql+psycopg://app_rw:local-only@db:5432/saas
    LOCAL_OBJECTS_DIR: /srv/build/objects
    DEMO_API: http://api:8000
    DEMO_TOKEN_FILE: /srv/build/demo-token.json
    DEMO_AUTH_STATE_FILE: /srv/build/auth-state.json  # accounts and sign-in keys survive an API restart (not `down -v`)
  volumes:
    - build:/srv/build

services:
  db:
    image: postgres:16
    # Throwaway data, so the database never waits for a disk: nothing is flushed on commit, the data lives in memory
    # (tmpfs), and checkpoints are rare. A slow Docker disk (Windows with WSL) once held a sign-in commit past the web
    # app's 20 second limit. DEMO ONLY: never copy these settings to a real database. Slow statements and lock waits
    # are logged so `docker compose -p gstdemo logs db` shows what was slow.
    command:
      - postgres
      - -c
      - fsync=off
      - -c
      - synchronous_commit=off
      - -c
      - full_page_writes=off
      - -c
      - checkpoint_timeout=30min
      - -c
      - max_wal_size=2GB
      - -c
      - log_min_duration_statement=500
      - -c
      - log_lock_waits=on
      # The API runs some database statements on its event loop, so one stuck statement freezes every request,
      # health checks included. These make the database give up instead of waiting: it never holds a statement
      # past 20 s, a lock past 5 s, or a transaction left open and idle past 30 s.
      - -c
      - statement_timeout=20000
      - -c
      - lock_timeout=5000
      - -c
      - idle_in_transaction_session_timeout=30000
    tmpfs:
      - /var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local-only
      POSTGRES_DB: saas
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d saas"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    <<: *api
    working_dir: /srv/migrator
    command: ["python", "-m", "migrator.local", "postgresql://postgres:local-only@db:5432/saas"]
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  api:
    <<: *api
    restart: unless-stopped
    command: ["python", "-m", "uvicorn", "app.api:asgi", "--app-dir", "app/src", "--host", "0.0.0.0", "--port", "8000", "--log-level", "${UVICORN_LOG_LEVEL:-info}"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/api/v1/health', timeout=3)"]
      interval: 2s
      timeout: 4s
      retries: 60

  web:
    build: { context: ., dockerfile: demo/Dockerfile, target: web }
    image: gstdemo-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:5173"  # this computer only, so Windows has no firewall question to ask
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      # Through the /api pass-through, the same path the browser uses, not just "nginx is up".
      test: ["CMD", "wget", "-q", "-T", "3", "-O", "/dev/null", "http://127.0.0.1:5173/api/v1/health"]
      interval: 2s
      timeout: 4s
      retries: 60

  codes:
    <<: *api
    command: ["python", "-u", "demo/watch_codes.py", "/srv/build/mail/outbox.jsonl"]
    environment:
      <<: *api-env
      HIDE_EMAIL: demo@example.com
    depends_on:
      api: { condition: service_healthy }

  seed:
    <<: *api
    command: ["python", "demo/seed.py", "http://api:8000"]
    environment:
      <<: *api-env
      MAIL_OUTBOX: /srv/build/mail/outbox.jsonl
    depends_on:
      api: { condition: service_healthy }
    restart: "no"

  tool:
    <<: *api
    entrypoint: ["python", "demo/tool.py"]
    command: ["status"]
    depends_on:
      api: { condition: service_healthy }
    restart: "no"

volumes:
  build:
