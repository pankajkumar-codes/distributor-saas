.ask-foot .btn{min-height:44px}.ask-note{font-size:11.5px;color:var(--muted)}

<script>
const S={view:'index',freq:'m',inv:'both',w:'desk',ob:1,plats:{amazon:true,flipkart:true,meesho:false,own:true},resolved:0,paid:false,plan:'m',type:'—',itc:{igst:12000,cgst:4000,sgst:4000,rev:0,pmt:0},itcSet:true,iv:{buyer:'customer',hsn:false,prev:'idle',tried:false}};
const $=s=>document.querySelector(s);
const NAV=[['index','Index'],['dash','Dashboard (v14)'],['invoice','New invoice (v14)'],['invdone','Invoice created (v14)'],['signup','Sign-up'],['home','Filing home'],['uploads','Uploads'],['verify','Cross-check'],['summary','Summary & pay'],['guide','Guide & JSON'],['w3b','GSTR-3B worksheet'],['w3bg','3B guide'],['setup','Business setup']];
function toast(t){const e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,2600)}
const F=()=>S.freq==='q'?'quarter':'month';
const per=()=>S.freq==='q'?'Jul–Sep 2026':'October 2026';
const info='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" style="flex:none"><circle cx="12" cy="12" r="9"/><path d="M12 8v.01M12 11v5"/></svg>';
const dateTag='<span class="chip info" title="Date comes from the R1-M0 dates table">Confirmed on GST portal</span>';
const sampleNote='<div class="note">Sample dates. In the product every date shows its GST portal source page and the day we last checked it. If a date can’t be confirmed, the row says “Check on the GST portal” and shows no date.</div>';
const platOpts=(on)=>['amazon:Amazon','flipkart:Flipkart','meesho:Meesho','own:Own sales invoices'].map(x=>{const[k,n]=x.split(':');return `<button class="opt" data-plat="${k}" aria-pressed="${!!S.plats[k]}"><span class="radio" style="border-radius:4px"></span><span><b>${n}</b>${k==='own'?'<br><span class="hint">Invoices you make yourself, as PDF and/or Excel</span>':''}</span></button>`}).join('');
const anyPlat=()=>Object.values(S.plats).some(Boolean);
const platErr=()=>anyPlat()?'':'<span class="hint" style="color:var(--bad);font-weight:600">Pick at least one to continue.</span>';
const typeField=`<div class="field"><label for="bt">Business type <span class="up">Upcoming</span></label><select class="inp" id="bt" disabled><option>Distributor / retail business</option></select><span class="hint">Invoicing for distributors and retailers is coming soon. You can’t pick this yet; filing works without it.</span></div>`;
const freqOpts=`<div class="grid2"><button class="opt" data-freq="m" aria-pressed="${S.freq==='m'}"><span class="radio"></span><span><b>Monthly</b><br><span class="hint">GSTR-1 and GSTR-3B every month</span></span></button><button class="opt" data-freq="q" aria-pressed="${S.freq==='q'}"><span class="radio"></span><span><b>Quarterly (QRMP)</b><br><span class="hint">GSTR-1 and GSTR-3B every quarter</span></span></button></div>`;

const V={};
V.index=()=>`<div class="stack" style="gap:22px">
<div><h1>Release 1 mocks, v15</h1><p class="sub">Web only. Business self sign-up, platforms and filing frequency, uploads, deadlines, a pay-at-the-end summary, the guide with a ready-to-upload GSTR-1 JSON, and (new in v13) a GSTR-3B worksheet: outward supplies computed from the same uploads, ITC typed in by the user. We don’t file for the user. Use the bar above to switch filing frequency, which own-invoice files were uploaded, and phone width. All names, GSTINs and amounts are sample data. Today in the mock is Thu 12 Nov 2026.</p></div>
<div class="grid3 idx">${[['dash','v14 · Home with direct links','Products, Customers, Invoices and a New invoice button'],['invoice','v14 · New invoice (one screen)','Create is the primary button; missing HSN fixed on the line; preview states'],['invdone','v14 · Invoice created','Download PDF, copy link, same-customer repeat'],['signup','1 · Sign-up and onboarding','Email, code, business profile, platforms, filing frequency, greyed “Upcoming” business type'],['home','2 · Filing home','GSTR-1 and GSTR-3B deadlines per period, and “File for this period”'],['uploads','3 · Uploads','Every section optional: Amazon, Flipkart, Meesho, own sales invoices (PDF and/or Excel)'],['verify','4 · Cross-check','PDF against Excel: differences highlighted so the user can fix them'],['summary','5 · Summary and pay','Brief business summary, plan, pay to unlock'],['guide','6 · Guide and JSON','Step-by-step portal upload guide and the GSTR-1 JSON download'],['w3b','7 · GSTR-3B worksheet (new)','Outward supplies from your uploads, your ITC entered by hand, tax payable before and after ITC, all figures marked sample or to be confirmed'],['w3bg','8 · 3B portal guide (new)','Step-by-step: enter the worksheet figures in GSTR-3B on the GST portal'],['setup','9 · Business setup','Change frequency, platforms and details any time']].map(x=>`<button class="card" data-go="${x[0]}"><b>${x[1]}</b><div class="hint" style="margin-top:4px">${x[2]}</div></button>`).join('')}</div>
<div class="card stack"><h2>Rules these mocks follow</h2><ul class="hint" style="margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px">
<li>Every upload section is optional. Own sales invoices need at least one of PDF or Excel.</li>
<li>Both PDF and Excel uploaded: we cross-check and highlight differences to fix.</li>
<li>Excel only: show “Upload your invoices and we can validate”. Once invoices are uploaded, that note is hidden.</li>
<li>Deadlines show only dates confirmed from the GST portal; otherwise “Check on the GST portal”.</li>
<li>No trial and no upfront charge. The user sees a summary, pays on the last page, then gets the guide and JSON. Prices are plus 18% GST on our fee.</li>
<li>Frequency and platforms can be changed any time in Business setup. The business-type field is greyed out with an “Upcoming” tag in sign-up and in setup.</li>
<li>GSTR-3B worksheet (v13): outward supplies are computed from the same uploads; ITC is typed in by the user (we don’t read GSTR-2B in R1). It is a worksheet to copy from, not a filed return.</li><li>Any 3B figure or rule not yet confirmed from official or CA sources shows a “To be confirmed” tag. Nothing is guessed.</li><li>Nothing here connects to the GST portal or files a return.</li></ul></div>
<div class="card stack"><h2>Open placeholders</h2><div class="tablewrap" style="border:0"><table><thead><tr><th>Placeholder</th><th>Owner</th></tr></thead><tbody>
<tr><td>Portal-confirmed GSTR-1 and GSTR-3B dates</td><td>R1-M0 dates table</td></tr>
<tr><td>Flipkart and Meesho report names and download steps</td><td>Research</td></tr>

function render(){
 $('#nav').innerHTML=NAV.map(n=>`<button data-go="${n[0]}" ${S.view===n[0]?'aria-current="page"':''}>${n[1]}</button>`).join('');
 $('#main').innerHTML=V[S.view]();
 document.body.classList.toggle('phone',S.w==='phone');
 for(const [id,k] of [['s-freq','freq'],['s-inv','inv'],['s-w','w']])document.querySelectorAll('#'+id+' button').forEach(b=>b.setAttribute('aria-pressed',S[k]===b.dataset.v));
 try{history.replaceState(null,'','#'+S.view)}catch(e){}
}
document.addEventListener('change',e=>{const k=e.target.dataset&&e.target.dataset.itc;if(!k)return;S.itc[k]=e.target.value;S.itcSet=true;render()});
document.addEventListener('click',e=>{
 const t=e.target.closest('button,[data-go]');if(!t)return;const d=t.dataset;
 if(t.closest('#s-freq,#s-inv,#s-w')){const k=t.closest('#s-freq')?'freq':t.closest('#s-inv')?'inv':'w';S[k]=d.v;if(k==='inv'){S.resolved=0}return render()}
 if(d.itcreset){S.itc={igst:0,cgst:0,sgst:0,rev:0,pmt:0};S.itcSet=false;return render()}
 if(d.go){S.view=d.go;window.scrollTo(0,0);return render()}
 if(d.toast)return toast(d.toast);
 if(d.plat){S.plats[d.plat]=!S.plats[d.plat];return render()}
 if(d.freq){S.freq=d.freq;return render()}
 if(d.plan){S.plan=d.plan;return render()}
 if(d.fix){S.resolved=Math.min(4,S.resolved+1);return render()}
 if(t.disabled)return;if(t.id==='ob-next'){if(S.ob<4){S.ob++}else{S.view='home';S.ob=1;toast('Account created. Here is your filing home.')}return render()}
 if(t.id==='ob-back'){S.ob--;return render()}
 if(t.id==='pay'){S.paid=true;S.view='guide';toast('Payment received (mock).');return render()}
});
document.addEventListener('click',e=>{const b=e.target.closest('[data-iv]');if(!b)return;const k=b.dataset.iv,v=S.iv;
 if(k==='hsn'){v.hsn=true;toast('HSN saved on the product.')}
 if(k==='cust')v.buyer='customer';if(k==='cash')v.buyer='cash';
 if(k==='prev'){v.prev='gen';render();setTimeout(()=>{if(S.iv.prev==='gen'){S.iv.prev='ready';render()}},1200);return}
 if(k==='resign'){v.prev='gen';toast('Signed in. Back on your invoice.');render();setTimeout(()=>{if(S.iv.prev==='gen'){S.iv.prev='ready';render()}},1200);return}
 if(k==='create'){S.view='invdone';window.scrollTo(0,0)}
 render()});

document.addEventListener('click',e=>{const b=e.target.closest('[data-pv]');if(!b)return;S.iv.prev=b.dataset.pv;S.view='invoice';document.querySelectorAll('#s-pv button').forEach(x=>x.setAttribute('aria-pressed',x===b));render()});
const h=location.hash.slice(1);if(V[h])S.view=h;
window.addEventListener('hashchange',()=>{const x=location.hash.slice(1);if(V[x]&&x!==S.view){S.view=x;render()}});
render();
</script>

<script>
/* v15 Ask Kartaa. Mock only: no network, no model. Texts are samples; real answers come from retrieved passages (docs/ASK_BOT.md). */
const A={st:'closed'};
const GI='https://tutorial.gst.gov.in/userguide/returns/index.htm';

const BODY={
 welcome:`<div class="ask-bot">Hi. Ask me how the GST portal works or how to use Kartaa. I keep answers short and point you to the GST portal guide when more is needed.</div><div class="ask-chips" aria-label="Try asking"><button>How do I file GSTR-1 on the portal?</button><button>What is the QRMP scheme?</button><button>Do I file GSTR-3B if I had no sales?</button><button>How does Kartaa read my Amazon report?</button></div>`,
 short:me('Do I have to file GSTR-3B if I had no business this month?')+bot('Yes. Filing GSTR-3B is mandatory for normal and casual taxpayers even when there was no business in the period. You file it as a nil return.',src('FAQs: Form GSTR-3B, Q5')+read('Read more on GST portal')+fb),
 long:me('How do I add invoices and file GSTR-1?')+bot('This takes several steps on the portal: sign in, open the Returns Dashboard, choose the period, add records table by table, generate the summary, then file with DSC or EVC. Kartaa gives you the ready GSTR-1 file to upload.',src('Manual: Form GSTR-1, sections A to J')+read('Read the full steps on GST portal',true)+fb),
 product:me('Does Kartaa file my return for me?')+bot('No. Kartaa prepares your GSTR-1 file and a GSTR-3B worksheet from your uploads. You upload and file on the GST portal yourself.',`<div class="ask-src"><span class="chip ok">Kartaa help</span>Guide and GSTR-1 JSON</div><button class="ask-read" data-go="guide">Open Guide and JSON</button>`+fb),
 none:me('What is the best way to save income tax?')+bot('I could not find this in the GST portal guides or Kartaa help. I only answer questions on those, and I can’t give tax or legal advice. Please ask your CA.',read('Browse GST portal guides')+'<button class="ask-read" data-toast="Support contact is a placeholder until set.">Contact support</button>'),
 loading:me('What is IFF?')+bot('<span class="ask-dots" role="status" aria-label="Looking for an answer"><span></span><span></span><span></span></span>'),
 slow:me('What is IFF?')+bot('<span class="ask-dots" role="status" aria-label="Still looking"><span></span><span></span><span></span></span> Still looking. This is taking longer than usual.','<button class="btn2" style="align-self:flex-start;min-height:40px">Cancel</button>'),
 err:me('What is IFF?')+bot('Something went wrong on our side. Your question is saved in the box below.','<button class="btn2" style="align-self:flex-start;min-height:40px">Try again</button>','err'),
 offline:me('What is IFF?')+bot('You are offline. Reconnect to ask. Your question will stay in the box.','','err'),
 limit:bot('You have asked a lot of questions for now. You can ask again in about 20 minutes. Meanwhile you can browse the guides.',read('Browse GST portal guides'),'err'),
 sess:bot('You were signed out. Sign in again to continue. Your question is kept in the box.','<button class="btn" style="align-self:flex-start;min-height:40px" data-toast="Sign-in page (existing).">Sign in</button>','err')
};
function askRender(){
 const f=$('#askfab'),p=$('#askpanel'),st=A.st;
 f.hidden=(st==='off');const open=!['off','closed'].includes(st);
 f.setAttribute('aria-expanded',open);f.style.display=open?'none':'';
 p.hidden=!open;

 p.innerHTML=`<div class="ask-head"><div class="t"><b id="asktitle">Ask Kartaa</b><span>GST portal guides and how to use Kartaa</span></div><button class="ask-ic" aria-label="Start a new chat" title="New chat"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button><button class="ask-ic" data-ask="closed" aria-label="Close">✕</button></div>

}
document.addEventListener('click',e=>{const b=e.target.closest('[data-ask],#askfab');if(!b)return;e.stopImmediatePropagation();A.st=b.id==='askfab'?'welcome':b.dataset.ask;askRender();if(b.id==='askfab'){const i=$('#askpanel input');i&&i.focus()}},true);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!['off','closed'].includes(A.st)){A.st='closed';askRender();$('#askfab').focus()}});
const _r=render;render=function(){_r.apply(this,arguments);document.documentElement.style.setProperty('--ask-lift',S.view==='invoice'&&S.w==='phone'?'72px':'0px');askRender()};
