<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Seller Portal Mocks v16</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#ffffff;--surface:#f4f4f4;--sunk:#fafafa;--ink:#111111;--muted:#5b5b5b;--faint:#767676;--line:rgba(17,17,17,.12);--line2:rgba(17,17,17,.2);
  --action:#1a4be0;--action-h:#1640c2;--action-soft:#eef2fd;
  --ok:#137333;--ok-soft:#e6f4ea;--warn:#8a4b00;--warn-soft:#fff3df;--bad:#b3261e;--bad-soft:#fdecea;
  --r-sm:4px;--r-md:6px;--r-lg:8px;--ease:cubic-bezier(.2,.8,.2,1);--enter:cubic-bezier(.22,1,.36,1);
  --sans:'Geist',system-ui,-apple-system,'Segoe UI',sans-serif;--mono:'Geist Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}html,body{margin:0}
body{font:15px/1.5 var(--sans);color:var(--ink);background:#e9e9e9;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
:focus-visible{outline:2px solid var(--action);outline-offset:2px}
/* mock control bar (not part of the product) */
.mockbar{position:sticky;top:0;z-index:60;background:#1b1b1b;color:#eee;display:flex;gap:10px;align-items:center;padding:8px 14px;font-size:13px;flex-wrap:wrap}
.mockbar b{font-weight:600}.mockbar .sep{flex:1}
.mockbar select,.mockbar button{background:#2c2c2c;color:#eee;border:1px solid #444;border-radius:4px;height:30px;padding:0 8px;font-size:13px;cursor:pointer}
.mockbar button[aria-pressed=true]{background:#eee;color:#111;border-color:#eee}
.mockbar .seg{display:inline-flex;gap:0}.mockbar .seg button{border-radius:0}.mockbar .seg button:first-child{border-radius:4px 0 0 4px}.mockbar .seg button:last-child{border-radius:0 4px 4px 0}
.mockbar .st{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.mockbar .lbl{color:#aaa}
/* stage */
.stage{container:app/inline-size;background:var(--bg);min-height:calc(100vh - 46px)}
body.phone .stage{width:390px;height:min(780px,calc(100vh - 80px));min-height:0;margin:24px auto;border:10px solid #111;border-radius:36px;overflow:auto;position:relative}
.app{display:grid;grid-template-columns:244px minmax(0,1fr);min-height:100%}
.side{border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:2px;position:sticky;top:46px;height:calc(100vh - 46px);overflow:auto;background:var(--bg)}
.biz{display:flex;gap:10px;align-items:center;padding:6px 8px 14px;border-bottom:1px solid var(--line);margin-bottom:6px}
.mark{width:28px;height:28px;border-radius:var(--r-md);background:var(--ink);display:grid;place-items:center;flex:none}
.mark i{width:12px;height:12px;border:2.5px solid #fff;border-radius:50%;border-right-color:transparent;transform:rotate(45deg)}
.biz b{font-size:14px;font-weight:600;display:block;line-height:1.2}.biz span{font-size:12px;color:var(--muted)}
.side .grp{font-size:12px;color:var(--muted);padding:12px 10px 2px}
.nav{display:flex;align-items:center;gap:10px;min-height:32px;padding:0 10px;border-radius:var(--r-md);border:0;background:none;cursor:pointer;text-align:left;font-size:14px;font-weight:500;color:#333;transition:background .15s var(--ease);width:100%}
.nav svg{width:17px;height:17px;flex:none;stroke:#8a8a8a;fill:none;stroke-width:1.6}
.nav[aria-current=page] svg{stroke:var(--ink)}
.nav:hover{background:var(--surface)}
.nav[aria-current=page]{background:var(--surface);color:var(--ink);box-shadow:inset 2px 0 0 var(--action)}
.nav .cnt{margin-left:auto;font-size:12px;color:var(--warn);background:var(--warn-soft);border-radius:10px;padding:0 7px;font-family:var(--mono)}
.side .foot{margin-top:auto;font-size:12px;color:var(--muted);padding:10px;border-top:1px solid var(--line)}
.top{height:60px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 32px;position:sticky;top:46px;background:var(--bg);z-index:5}
body.phone .top{top:0}body.phone .side{top:0}
.search{flex:1;max-width:460px;height:36px;display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:var(--r-md);padding:0 12px;color:var(--muted);font-size:14px;background:var(--sunk)}
.search svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.7}
.top .sp{flex:1}.top .bizname{display:none;font-weight:600;font-size:15px;margin-right:auto}
.practice{font-size:12px;color:var(--warn);display:flex;align-items:center;gap:6px}
.practice::before{content:"";width:6px;height:6px;border-radius:50%;background:#d98a00}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 18px;border-radius:var(--r-md);border:1px solid var(--ink);background:var(--ink);color:#fff;font-weight:500;font-size:14px;cursor:pointer;transition:transform .15s var(--ease),background .15s var(--ease);white-space:nowrap}
.btn.primary{background:var(--action);border-color:var(--action)}
.btn.sec{background:var(--bg);color:var(--ink);border-color:var(--line2)}
.btn.sm{min-height:32px;padding:0 12px;font-size:13px}
.btn.danger{background:var(--bg);color:var(--bad);border-color:rgba(179,38,30,.4)}
.btn:hover{transform:translateY(-1px)}.btn.primary:hover{background:var(--action-h)}.btn.sec:hover{background:var(--surface)}
.btn:active{transform:translateY(1px) scale(.985);transition-duration:.09s}
.btn[disabled]{opacity:.4;cursor:not-allowed;transform:none}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;transition:transform .15s var(--ease)}
.btn:hover svg.arr{transform:translateX(3px)}
.link{color:var(--action);background:none;border:0;padding:0;cursor:pointer;font-weight:500;text-decoration:underline;text-decoration-color:rgba(26,75,224,.3);text-underline-offset:3px;font-size:inherit}
.link:hover{text-decoration-color:var(--action)}
main{padding:36px 32px 90px;max-width:1180px}
h1{font-size:32px;line-height:1.12;font-weight:500;letter-spacing:-.025em;margin:0;max-width:30ch}
h1 .muted,h2 .muted{color:var(--faint)}
h2{font-size:17px;font-weight:600;letter-spacing:-.01em;margin:0}
h3{font-size:15px;font-weight:600;margin:0}
.lead{color:var(--muted);margin:10px 0 0;font-size:16px;max-width:64ch}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}
.eyebrow{font-size:13px;color:var(--muted);margin-bottom:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;min-height:22px;padding:0 8px;border-radius:var(--r-sm);font-size:12px;font-weight:500;white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}.chip.warn{background:var(--warn-soft);color:var(--warn)}.chip.bad{background:var(--bad-soft);color:var(--bad)}.chip.mute{background:var(--surface);color:var(--muted)}.chip.blue{background:var(--action-soft);color:var(--action)}
.code{font-family:var(--mono);font-size:11px;color:var(--faint);border:1px solid var(--line);border-radius:3px;padding:0 5px;margin-left:6px;white-space:nowrap}
.panel{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--bg);margin-top:20px}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.pad{padding:16px 18px}
.on [data-in]{animation:rise .6s var(--enter) both}
.on [data-in="2"]{animation-delay:.06s}.on [data-in="3"]{animation-delay:.12s}.on [data-in="4"]{animation-delay:.18s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
.grid2 > .panel{margin-top:20px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:11px 18px;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border-bottom:0}.kv > span:first-child{color:var(--muted)}
.kv.total{font-weight:600}.kv.total > span:first-child{color:var(--ink)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:500;color:var(--muted);font-size:12px;padding:10px 18px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px 18px;border-bottom:1px solid var(--line);vertical-align:top}tr:last-child td{border-bottom:0}
th.r,td.r{text-align:right}
tbody tr.hov{transition:background .15s var(--ease);cursor:pointer}tbody tr.hov:hover{background:var(--sunk)}
.pname{font-weight:500}.sub2{font-size:12px;color:var(--muted)}
.hint{font-size:13px;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.field > label,.flabel{font-size:13px;font-weight:500}
.inp{height:40px;border:1px solid var(--line2);border-radius:var(--r-md);padding:0 12px;background:var(--bg);width:100%}
textarea.inp{height:72px;padding:10px 12px;resize:vertical}
.inp:focus{border-color:var(--action);outline:none;box-shadow:0 0 0 3px rgba(26,75,224,.15)}
.inp.ph{color:var(--faint)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.radio{display:flex;gap:8px;flex-wrap:wrap}
.radio label{display:flex;gap:8px;align-items:center;border:1px solid var(--line2);border-radius:var(--r-md);padding:8px 12px;cursor:pointer;font-size:14px;min-height:40px}
.radio label.on{border-color:var(--action);box-shadow:0 0 0 1px var(--action)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;padding:6px 0}
.check input{margin-top:4px;width:16px;height:16px;accent-color:var(--action)}
.banner{display:flex;gap:12px;align-items:flex-start;padding:12px 16px;border-radius:var(--r-md);font-size:14px;margin-top:16px}
.banner.warn{background:var(--warn-soft);color:#5c3200}.banner.ok{background:var(--ok-soft);color:#0d4f23}.banner.bad{background:var(--bad-soft);color:#7a1a14}.banner.info{background:var(--surface);color:var(--ink)}
.banner b{font-weight:600}
.empty{padding:22px 18px;color:var(--muted);font-size:14px}
.issue{display:flex;gap:14px;align-items:flex-start;padding:14px 18px;border-bottom:1px solid var(--line)}
.issue:last-child{border-bottom:0}
.issue .ic{width:22px;height:22px;border-radius:50%;background:var(--warn-soft);color:var(--warn);display:grid;place-items:center;font-size:13px;font-weight:600;flex:none;margin-top:1px}
.issue.bad .ic{background:var(--bad-soft);color:var(--bad)}
.issue.fixed .ic{background:var(--ok-soft);color:var(--ok)}
.issue .tx{flex:1;min-width:0}.issue .tx b{font-weight:500;display:block}.issue .tx span{font-size:13px;color:var(--muted)}
/* guided card */
.guide{border:1px solid var(--ink);border-radius:var(--r-lg);padding:22px 24px;background:var(--bg)}
.guide .gk{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center}
.guide h2{font-size:22px;font-weight:500;letter-spacing:-.02em;margin:6px 0 4px}
.path{list-style:none;margin:16px 0 18px;padding:0;display:grid;gap:0}
.path li{display:grid;grid-template-columns:24px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.path .d{width:18px;height:18px;border-radius:50%;border:2px solid var(--line2);display:grid;place-items:center;font-size:11px}
.path li.done .d{background:var(--ink);border-color:var(--ink);color:#fff}
.path li.done span.t{color:var(--muted)}
.path li.cur .d{border-color:var(--action);box-shadow:0 0 0 3px var(--action-soft)}
.path li.cur span.t{font-weight:500}
.homegrid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px;margin-top:24px;align-items:start}
.homegrid > .panel{margin-top:0}
/* timeline */
.tl{padding:20px 22px 16px}
.tl-track{position:relative;height:56px;margin-top:8px}
.tl-line{position:absolute;left:0;right:0;top:26px;height:4px;background:var(--surface);border-radius:2px}
.tl-fill{position:absolute;left:0;top:26px;height:4px;background:var(--ink);border-radius:2px;width:calc(6/30*100%)}
.tl-m{position:absolute;top:0;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;font-size:12px;white-space:nowrap}
.tl-m .d{width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid var(--ink);margin-top:22px}
.tl-m.due .d{border-color:var(--action);background:var(--action)}.tl-m.today .d{background:var(--ink)}
.tl-m .lab{position:absolute;top:0;font-weight:500}.tl-m .sub{position:absolute;top:40px;color:var(--muted)}
.tl-list{display:none}
.tl-list div{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}.tl-list div:last-child{border:0}
.links{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.links .panel{margin-top:20px}.links ul{list-style:none;margin:0;padding:6px 0}.links li{padding:7px 18px;font-size:14px}
/* steps */
.steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));margin-top:24px;border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.step{padding:12px 14px;border-right:1px solid var(--line);font-size:13px;color:var(--muted)}
.step:last-child{border-right:0}
.step b{display:block;color:var(--ink);font-weight:500;font-size:14px;margin-top:2px}
.step.done{background:var(--sunk)}.step.cur{box-shadow:inset 0 -2px 0 var(--action)}
.step .n{font-family:var(--mono);font-size:12px}
.tie{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;align-items:center;gap:16px;padding:18px}
.tie .box span{display:block;font-size:12px;color:var(--muted)}.tie .box b{font-weight:500;font-size:17px}
.tie .op{color:var(--muted);font-family:var(--mono)}
.dl{display:flex;gap:20px;align-items:center;justify-content:space-between;padding:20px 22px;border:1px solid var(--ink);border-radius:var(--r-lg);margin-top:20px}
.dl p{margin:4px 0 0;color:var(--muted);font-size:14px;max-width:60ch}
/* invoice */
.inv{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:28px;margin-top:20px;align-items:start}
.seg2{display:inline-flex;align-self:flex-start;border:1px solid var(--line2);border-radius:var(--r-md);overflow:hidden}
.seg2 button{border:0;background:var(--bg);padding:0 14px;min-height:38px;font-size:14px;cursor:pointer;border-right:1px solid var(--line2)}
.seg2 button:last-child{border-right:0}.seg2 button[aria-pressed=true]{background:var(--ink);color:#fff}
.ccard{border:1px solid var(--line2);border-radius:var(--r-md);padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;background:var(--bg)}
.ccard b{font-weight:600}.ccard .sub2{grid-column:1}
.results{border:1px solid var(--line2);border-radius:var(--r-md);margin-top:6px;overflow:hidden}
.results button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:var(--bg);padding:9px 12px;cursor:pointer;font-size:14px}
.results button:last-child{border-bottom:0}.results button:hover{background:var(--sunk)}
.results .sub2{display:block}
.pos{display:flex;gap:10px;align-items:center;font-size:13px;padding:10px 12px;background:var(--surface);border-radius:var(--r-md);margin-top:8px;flex-wrap:wrap}
.datef{position:relative;display:flex;align-items:center;cursor:pointer}
.datef .inp{cursor:pointer;padding-right:40px}
.datef svg{position:absolute;right:12px;width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:1.6;pointer-events:none}
.cal{position:absolute;top:44px;left:0;z-index:8;background:var(--bg);border:1px solid var(--line2);border-radius:var(--r-md);box-shadow:0 12px 32px rgba(17,17,17,.12);padding:10px;width:260px;font-size:13px}
.cal .g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cal .g span{padding:5px 0;border-radius:4px}.cal .g .h{color:var(--muted);font-size:11px}.cal .g .t{background:var(--action);color:#fff}.cal .g .x{color:#bbb}
.items td{padding:10px 12px;vertical-align:top}.items th{padding:8px 12px}
.qty{width:64px;height:32px;border:1px solid var(--line2);border-radius:var(--r-sm);text-align:right;padding:0 8px;font-family:var(--mono)}
.rate{width:96px}
.qty:focus{border-color:var(--action);outline:none;box-shadow:0 0 0 3px rgba(26,75,224,.15)}
.addrow{display:flex;gap:6px;flex-wrap:wrap;padding:12px;border-top:1px solid var(--line)}
.addp{border:1px dashed var(--line2);border-radius:var(--r-sm);background:none;padding:6px 10px;font-size:13px;cursor:pointer;transition:background .15s}
.addp:hover{background:var(--surface)}
.hsnfix{display:flex;gap:8px;align-items:flex-end;margin-top:8px;padding:10px;background:var(--warn-soft);border-radius:var(--r-sm);flex-wrap:wrap}
.hsnfix .inp{height:32px;width:120px}
.lnote{font-size:12px;margin-top:6px;padding:6px 8px;border-radius:var(--r-sm)}
.lnote.bad{background:var(--bad-soft);color:var(--bad)}.lnote.warn{background:var(--warn-soft);color:var(--warn)}.lnote.mute{background:var(--surface);color:var(--muted)}
.paper{background:#fff;border:1px solid var(--line);border-radius:var(--r-sm);box-shadow:0 1px 0 rgba(17,17,17,.04),0 18px 48px rgba(17,17,17,.08);padding:26px 24px;font-size:12px}
.paperwrap{position:sticky;top:120px}
.paper .ph{display:flex;justify-content:space-between;align-items:flex-start;padding-bottom:14px;border-bottom:2px solid var(--ink)}
.paper .ttl{font-size:15px;font-weight:600;letter-spacing:-.01em}
.stamp{font-size:10px;font-weight:600;color:var(--warn);border:1px solid #e0b36a;padding:2px 6px;border-radius:2px;letter-spacing:.06em}
.paper .two{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
.paper .two span.k{color:var(--muted);display:block;font-size:11px}
.paper table{font-size:11.5px}.paper th{padding:8px 4px;font-size:11px}.paper td{padding:7px 4px}
.paper .tot{margin-top:8px;border-top:1px solid var(--line);padding-top:8px}
.paper .tot div{display:flex;justify-content:space-between;padding:3px 0}
.paper .grand{font-size:15px;font-weight:600;border-top:2px solid var(--ink);margin-top:6px;padding-top:8px!important}
.paper .words{color:var(--muted);font-size:11px;margin-top:8px}
.prev{margin-top:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px}
.bar{position:sticky;bottom:0;background:rgba(255,255,255,.97);border-top:1px solid var(--line);padding:12px 0;margin-top:20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;z-index:4}
.bar .hint{flex:1;min-width:220px}
details.box{border:1px solid var(--line);border-radius:var(--r-md);margin-bottom:16px}
details.box summary{padding:12px 14px;cursor:pointer;font-weight:500;font-size:14px}
details.box > div{padding:4px 14px 14px}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);opacity:0;background:var(--ink);color:#fff;padding:12px 16px;border-radius:var(--r-md);font-size:14px;display:flex;gap:14px;align-items:center;transition:all .3s var(--enter);z-index:70;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.filters{display:flex;gap:6px;margin:20px 0 0;flex-wrap:wrap}
.fchip{min-height:30px;padding:0 12px;border:1px solid var(--line);border-radius:15px;background:none;font-size:13px;cursor:pointer}
.fchip[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.toolbar{display:flex;gap:10px;align-items:center;margin-top:20px;flex-wrap:wrap}
.toolbar .search{max-width:360px}
.cardgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.cardgrid .panel{margin-top:20px}
.drop{border:1px dashed var(--line2);border-radius:var(--r-md);padding:16px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:14px 18px 16px}
.held{border:1px solid var(--line);border-radius:var(--r-md);padding:14px 16px;margin:12px 18px}
.held dl{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px 16px;margin:10px 0;font-size:13px}
.held dt{color:var(--muted);font-size:12px}.held dd{margin:0}

 return `<div class="authwrap" style="max-width:560px;margin-top:20px">${brand.replace('margin-bottom:24px','')}<div class="panel" style="padding:22px 26px">${bar}${body}<button class="btn primary" style="width:100%;margin-top:6px" ${n<4?`data-state="${nx}"`:'data-go="home"'}>${n<4?'Continue':'Go to Home'}</button></div></div>`}};

  <div class="ld-who" data-in="4">${['Retailers','Distributors','Wholesalers','Online sellers'].map(x=>chip(x)).join('')}</div></div>
  <div class="ld-vis" data-in="3">${paper}<div class="ld-ret"><span class="sub2">GSTR-1 for November</span><b>Built from your invoices</b><div class="row between" style="margin-top:8px"><span class="num">41 invoices</span>${chip('Ready to review','ok')}</div></div></div></section>
  <p class="hint" style="margin:-40px 0 24px">Example with sample data.</p></div>
 <div class="ld-w"><section class="ld-sec"><div class="eyebrow">What you get</div><h2>Everything for the GST side of selling, in one place.</h2>

 <section class="ld-sec"><div class="eyebrow">How it works</div><h2>From sign-up to a return ready to review.</h2>
  <div class="ld-steps"><div><span class="n">Step 1</span><h3>Set up your business</h3><p>Enter your GSTIN; your details fill in. Add products and customers.</p></div><div><span class="n">Step 2</span><h3>Create invoices</h3><p>Raise invoices as you sell. Add marketplace reports if you sell online.</p></div><div><span class="n">Step 3</span><h3>Review and file</h3><p>Check the prepared GSTR-1 and GSTR-3B, then file them on the GST portal.</p></div></div></section>
 <section class="ld-sec"><div class="eyebrow">Pricing</div><h2>Simple plans. GST at 18% is added on top.</h2><p class="lead">Free for now while we launch. Paid plans start later, and we will tell you before they do.</p>
  <div class="ld-price"><div class="ld-plan"><h3>GST filing</h3><div class="amt num">₹499</div><div class="hint">a month, or ₹1,499 a quarter</div><ul><li>GSTR-1 and GSTR-3B prepared for you</li><li>Upload your own invoices and purchases</li></ul></div>
  <div class="ld-plan hl"><h3>Invoicing and GST filing</h3><div class="amt num">₹999</div><div class="hint">a month, or ₹2,499 a quarter</div><ul><li>Everything in GST filing</li><li>Sales invoices, products and stock</li><li>Your first 10 invoices are free</li></ul></div></div>
  <p class="hint" style="max-width:70ch">Prices are before 18% GST. Marketplace uploads are an add-on. Paid plans are not refundable; when you change plan we show the prorated amount first.</p></section>
 <section class="ld-sec"><div class="eyebrow">Questions</div><h2>Before you sign up</h2><div class="ld-faq">${faq.map((f,i)=>`<details ${i?'':'open'}><summary>${f[0]}</summary><p>${f[1]}</p></details>`).join('')}</div></section>
 <section class="ld-sec"><div class="ld-cta"><div><h2 style="font-size:26px">Set up your business</h2><p class="hint" style="margin:6px 0 0">GST invoicing and returns for small businesses in India.</p></div><button class="btn primary" data-go="signup">Sign up free ${arr}</button></div></section>

/* ---------- router ---------- */
const ORDER=['index','landing','signin','signup','home','invoice','doc','drafts','issued','customers','customer','products','product','import','stock','purchases','review','plan','filing','gstr1','guide','w3b','uploads','held','crosscheck','fileperiod','periodfiles','setup','team','audit','security','support'];
$('#screenSel').innerHTML=ORDER.map(k=>`<option value="${k}">${R[k].title}</option>`).join('');
$('#navlist').innerHTML=NAV.map(g=>`${g[0]==='Home'?'':`<div class="grp">${g[0]}</div>`}${g[1].map(n=>`<button class="nav" data-go="${n[0]}"><svg viewBox="0 0 24 24">${n[2]}</svg>${n[1]}${n[0]==='gstr1'?'<span class="cnt" id="g1cnt">2</span>':n[0]==='uploads'?'<span class="cnt">2</span>':''}</button>`).join('')}`).join('');
$('#tabbar').innerHTML=[['home','Home'],['invoice','New'],['issued','Invoices'],['gstr1','GST'],['index','More']].map(t=>`<button data-go="${t[0]}"><svg viewBox="0 0 24 24">${ICON[t[0]]||'<circle cx="6" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="18" cy="12" r="1.5"/>'}</svg>${t[1]}</button>`).join('');
function render(){const r=R[S.route]||R.index;const st=S.st[S.route]||(r.states?r.states[0]:null);
 if(r.auth){$('#app').style.display='none';$('#auth').innerHTML=`<div class="on" style="min-height:100%;background:var(--sunk);padding:1px 0 40px">${r.render(st)}</div>`;$('#tabbar').style.display='none'}
 else{$('#app').style.display='';$('#auth').innerHTML='';$('#tabbar').style.display='';$('#main').className=r.tight?'tight':'';$('#main').innerHTML=`<section class="page on${S._anim?'':' noanim'}">${r.render(st)}</section>`}
 S._anim=false;
 const cur=PARENT[S.route]||S.route;
 document.querySelectorAll('.nav').forEach(n=>n.setAttribute('aria-current',n.dataset.go===cur?'page':'false'));
 document.querySelectorAll('.tabbar button').forEach(b=>b.classList.toggle('cur',b.dataset.go===cur||(b.dataset.go==='gstr1'&&['filing','w3b','uploads','held'].includes(cur))));
 $('#screenSel').value=S.route;requestAnimationFrame(()=>document.documentElement.style.setProperty('--mb',document.querySelector('.mockbar').offsetHeight+'px'));
 $('#states').innerHTML=r.states?`<span class="lbl">State</span><span class="seg">${r.states.map(s=>`<button data-state="${s}" aria-pressed="${s===st}">${s}</button>`).join('')}</span>`:'';
 const c=$('#g1cnt');if(c){const l=2-S.g1fixed;c.hidden=!l;c.textContent=l}
}
function go(k){if(!R[k])k='index';S.route=k;S._anim=true;if(location.hash.slice(1)!==k)history.replaceState(null,'','#'+k);render();const sg=$('#stage');sg.scrollTop=0;window.scrollTo(0,0)}
function setState(s){const r=R[S.route];if(!r.states||!r.states.includes(s))return;S.st[S.route]=s;render()}
document.addEventListener('click',e=>{
 const t=e.target;
 const tb=t.closest('[data-tab]');if(tb){const [k,i]=tb.dataset.tab.split(':');S.tab[k]=+i;render();return}
 const pgb=t.closest('[data-pg]');if(pgb&&!pgb.disabled){const [k,i]=pgb.dataset.pg.split(':');S.pg[k]=+i;render();return}
 const gs=t.closest('[data-state]');if(gs){setState(gs.dataset.state);return}
 const g=t.closest('[data-go]');if(g&&!t.closest('[data-hsn],[data-held]')){go(g.dataset.go);return}
 const I=S.inv;
 const m=t.closest('[data-mode]');if(m){I.mode=m.dataset.mode;render();return}
 const c=t.closest('[data-cust]');if(c){I.cust=customers.find(x=>x.id===c.dataset.cust);I.searching=false;I.q='';render();return}
 const a=t.closest('[data-act]');if(a){const k=a.dataset.act;
  if(k==='change'){I.searching=true;render();setTimeout(()=>{const q=$('#custq');q&&q.focus()},0)}
  else if(k==='cal'){if(!t.closest('[data-day]')){I.cal=!I.cal;render()}}
  else if(k==='t13'){S.t13.confirmed=true;render()}
  else if(k==='make'||k==='remake'){S.made=true;render();toast('Your file (version 1) is ready. Download it, then upload it on the GST portal.')}
  else if(k==='filed'){S.filed=true;render()}
  else if(k==='dlg'){if(!t.closest('[data-stop]')||t.closest('button[data-act="dlg"]')){I.dlg=!I.dlg;render()}}
  else if(k==='bulk'){S.heldBulk=!S.heldBulk;render()}
  if(k!=='cal')return}
 const rm=t.closest('[data-rm]');if(rm){I.lines.splice(+rm.dataset.rm,1);render();return}
 const day=t.closest('[data-day]');if(day){I.date=String(day.dataset.day).padStart(2,'0')+'-12-2026';I.cal=false;render();return}
 const ad=t.closest('[data-add]');if(ad){const p=products.find(x=>x.id===ad.dataset.add);I.lines.push({id:p.id,qty:1,price:p.price,rate:p.rate,disc:0});I.pq='';render();const pqi=$('#prodq');pqi&&pqi.focus();return}
 const h=t.closest('[data-hsn]');if(h){const v=($('#hsn-'+h.dataset.hsn)||{}).value||'';if(/^\d{4}(\d{2}){0,2}$/.test(v)){I.hsnFixed[h.dataset.hsn]=v;render();toast('HSN saved on the product.')}else toast("That isn't a valid HSN: use 4, 6 or 8 digits, no spaces.");return}
 const f=t.closest('[data-fix]');if(f){S.g1fixed=Math.max(S.g1fixed,+f.dataset.fix+1);render();return}
 const tc=t.closest('[data-t13]');if(tc){S.t13.amazon=tc.checked;return}
 const hd=t.closest('[data-held]');if(hd){S.held[hd.dataset.held]=hd.dataset.v==='Left out'?'Left out':hd.dataset.v;render();return}
 const pf=t.closest('[data-pf]');if(pf){S.pfilter=pf.dataset.pf;render();return}
 const pc=t.closest('[data-cat]');if(pc&&!pc.disabled){S.prodCat=pc.dataset.cat;render();return}
 if(t.id==='create'&&!t.disabled){toast('Practice invoice PR-0043 created. It is locked.');I.lines=[];I.cust=null;I.date=null;setTimeout(()=>go('doc'),900)}
});
document.addEventListener('input',e=>{const I=S.inv;const t=e.target;
 if(t.id==='custq'){I.q=t.value;const pos=t.selectionStart;render();const q=$('#custq');q.focus();q.setSelectionRange(pos,pos)}
 if(t.id==='prodq'){I.pq=t.value;const pos=t.selectionStart;render();const q=$('#prodq');q.focus();q.setSelectionRange(pos,pos)}
 const paise=s=>{const m=String(s).trim().match(/^(\d+)(?:\.(\d{0,2}))?$/);return m?parseInt(m[1],10)*100+parseInt((m[2]||'').padEnd(2,'0')||'0',10):0};
 const key=['q','r','d'].find(k=>t.dataset[k]!=null);
 if(key){const i=+t.dataset[key],l=I.lines[i];if(key==='q'){const v=parseInt(t.value,10);l.qty=isFinite(v)&&v>0?v:0}else if(key==='r')l.price=paise(t.value);else l.disc=paise(t.value);
  const cell=document.querySelector(`[data-lt="${i}"]`);if(cell)cell.textContent=inr(lineVal(l));
  const tt=compute(I.lines,posOf(I.cust,I.mode==='cash'?I.cash:null));const g=$('#grand');if(g){const pw=g.closest('.paper');const tmp=document.createElement('div');S.inv._keep=true;
   /* refresh the paper only, so the field keeps focus */
   const html=R.invoice.render(S.st.invoice||R.invoice.states[0]);tmp.innerHTML=html;pw.replaceWith(tmp.querySelector('.paper'));const nb=tmp.querySelector('.bar');document.querySelector('.invpage .bar').replaceWith(nb)}}
});
document.addEventListener('change',e=>{if(e.target.id==='cashst'){S.inv.cash=e.target.value;render()}});
$('#screenSel').onchange=e=>go(e.target.value);
function view(p){document.body.classList.toggle('phone',p);$('#vDesk').setAttribute('aria-pressed',!p);$('#vPhone').setAttribute('aria-pressed',p)}
$('#vDesk').onclick=()=>view(false);$('#vPhone').onclick=()=>view(true);
addEventListener('hashchange',()=>go(location.hash.slice(1)));
go(location.hash.slice(1)||'index');
</script>
