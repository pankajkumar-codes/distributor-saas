[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
# "gst-app" is a placeholder until the product is named (build-readiness 1.4).
name = "gst-app"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.121",
    "mangum>=0.19",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "openpyxl>=3.1",
    "pyyaml>=6.0",  # platform_common reads its permission matrix
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "uvicorn>=0.30", "pytest-cov"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["migrations/*.sql"]

[tool.pytest.ini_options]
pythonpath = ["src", "../libs/platform_common"]
testpaths = ["src/app/modules", "tests"]
