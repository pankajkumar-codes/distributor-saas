# The demo's web server: the built app, and /api passed through to the API container.
# Local demo only (docker-compose.demo.yml). It replaces `vite preview`, a development tool that kept one
# proxy connection pool for hours; here every /api request opens a fresh connection to the API and gives up
# quickly, so a stuck connection can never wedge the page.
map $cookie_kartaa_in $home {
    default /_landing/index.html;
    "1"     /index.html;
}

server {
    listen 5173;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's own DNS, asked again every 5 seconds, so a restarted API container is found again.
    resolver 127.0.0.11 valid=5s ipv6=off;

    location /api/ {
        set $upstream http://api:8000;
        proxy_pass $upstream;          # no keepalive pool: a new connection to the API for every request
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_send_timeout 30s;
        proxy_read_timeout 60s;        # the web app gives up on its own at 30 s (20 s for sign-in)
        client_max_body_size 50m;      # uploads
    }

    # The Kartaa landing page (built from landing/ into /_landing) is the page at "/" for a visitor with no session; its
    # Sign in and Sign up buttons go to /signin and /signup in the app. The app sets the plain `kartaa_in` cookie while
    # someone is signed in (web/src/auth/session.ts); with it, "/" is the app, which sends them to their home.
    # The page is served from this location itself (not by a rewrite) so the headers below survive; the answer depends
    # on the cookie, so a browser must ask again each time.
    location = / {
        add_header Cache-Control "no-cache" always;
        add_header Vary Cookie always;
        try_files $home =404;
    }
    location = /styles.css { rewrite ^ /_landing/styles.css last; }
    location /fonts/ { rewrite ^/fonts/(.*)$ /_landing/fonts/$1 last; }

    # Script and style names carry a hash of their content, so a browser may keep them; a new build has new names.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;           # a missing script is a 404, not the app's page
    }

    # index.html names the current build's scripts, so the browser must ask again every time (as in the cloud,
    # deploy-staging.yml). Without this, a reload after `git pull` and `./demo.sh` could show the old app.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;    # the app's own pages (/signin, /b/...) all load index.html
    }
}
