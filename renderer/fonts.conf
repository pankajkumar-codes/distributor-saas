<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- The renderer's only fonts (TD-9): the files next to this one, never the system's.
     The cache goes to /tmp, the only writable path on Lambda. -->
<fontconfig>
  <dir prefix="relative">.</dir>
  <cachedir>/tmp/fontconfig-cache</cachedir>
</fontconfig>
