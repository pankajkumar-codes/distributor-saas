[project]
name = "platform-common"
version = "0.1.0"
requires-python = ">=3.12"
# fastapi 0.121 added Depends(scope="function"): units of work commit before the response.
dependencies = ["fastapi>=0.121", "sqlalchemy>=2.0", "pyyaml>=6.0", "pyjwt[crypto]>=2.8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Only the package: migrations/ is SQL the migrator collects, not Python.
[tool.setuptools]
packages = ["platform_common"]

[tool.setuptools.package-data]
platform_common = ["*.yaml"]
